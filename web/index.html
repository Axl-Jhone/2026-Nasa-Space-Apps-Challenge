<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS: Earth Analog Atlas</title>
<meta name="description" content="Earth sites that stand in for places on the Moon and Mars: where each analogy holds, and where it breaks.">
<meta name="generator" content="Built with an AI assistant (Claude, by Anthropic), directed by the team. See the Method and sources tab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme-ascii.css"><!-- ASCII square space theme: remove this line for the previous look -->
</head>
<body>
<div class="app">
  <header class="mast">
    <a class="brand" href="#worlds"><b>ATLAS</b></a>
    <nav class="tabs" aria-label="Main">
      <button data-tab="worlds" aria-pressed="true">Three worlds</button>
      <button data-tab="explore" aria-pressed="false">All pairs</button>
      <button data-tab="method" aria-pressed="false">Method</button>
    </nav>
  </header>

  <main>
    <!-- 1. THREE WORLDS -->
    <section class="view" id="view-worlds">
      <div class="main-col">
        <h1 class="lede">Places on Earth that stand in for the Moon and Mars, and where each stand-in stops.</h1>
        <div class="globes">
          <figure><figcaption><span class="dot earth"></span>Earth</figcaption><div class="globe earth" id="globe-earth" role="img" aria-label="Globe of Earth with analog site pins"><canvas></canvas></div><p class="cap" id="cap-earth"></p></figure>
          <figure id="fig-moon"><figcaption><span class="dot moon"></span>Moon<small id="sz-moon"></small></figcaption><div class="globe moon" id="globe-moon" role="img" aria-label="Globe of the Moon with counterpart pins"><canvas></canvas></div><p class="cap" id="cap-moon"></p></figure>
          <figure id="fig-mars" hidden><figcaption><span class="dot mars"></span>Mars<small id="sz-mars"></small></figcaption><div class="globe mars" id="globe-mars" role="img" aria-label="Globe of Mars with counterpart pins"><canvas></canvas></div><p class="cap" id="cap-mars"></p></figure>
        </div>
        <!-- zoom view: two maps at one scale, live pictures over saved copies (js/zoom.js) -->
        <div class="zoomwrap" id="zoomwrap" hidden>
          <div class="zmaps" id="zmaps"></div>
          <div class="zfoot"><span class="zscale" id="zscale"></span>
            <div class="seg mapkind" id="mapkind" role="group" aria-label="What the maps show">
              <button data-kind="sat" aria-pressed="true">Satellite</button>
              <button data-kind="topo" aria-pressed="false" title="Height shown as colour with shading">Topography</button>
            </div><button class="btn alt" id="zterrain" hidden>See the measured terrain in 3D →</button></div>
          <form class="qtform" id="qtform">
            <label for="qtll">Test any place on Earth</label>
            <input id="qtll" name="ll" inputmode="decimal" autocomplete="off" placeholder="latitude, longitude  e.g. 64.07, -16.20" aria-describedby="qthelp">
            <button class="zoomgo" type="submit">Test</button>
            <span class="fineprint" id="qthelp">or click the Earth map</span>
          </form>
          <div class="qt" id="ztest" aria-live="polite" hidden></div>
          <p class="fineprint" id="zoommsg"></p>
        </div>
        <p class="tourcap" id="tourcap" aria-live="polite" hidden></p>
        <div class="otherbar">
          <span class="mono">Compare Earth with</span>
          <div class="seg" id="other-toggle" role="group" aria-label="Second world">
            <button data-b="moon" aria-pressed="true">Moon</button>
            <button data-b="mars" aria-pressed="false">Mars</button>
          </div>
          <button class="zoomgo" id="zoom-go" aria-pressed="false">Zoom in to both places</button>
          <button class="zoomgo" id="tour-go" aria-pressed="false">Play the 30-second tour</button>
        </div>
      </div>
      <aside class="side dock" id="sites-dock" aria-label="Analog sites">
        <button class="rail" id="sites-toggle" aria-controls="sites-body" aria-expanded="true"><span class="chev" aria-hidden="true"></span><span class="lbl">Sites</span></button>
        <div class="dockbody" id="sites-body">
          <div class="slist" id="slist">
            <div class="top"><h2>Sites</h2><div class="pills" id="filters" role="group" aria-label="Filter"></div></div>
            <ul class="sites" id="sitelist"></ul>
          </div>
          <div class="sdetail" id="sdetail" hidden></div>
        </div>
      </aside>
    </section>

    <!-- 3. SIDE BY SIDE -->
    <section class="view" id="view-side-by-side" hidden>
      <div class="sbs">
        <div class="row">
          <a class="back" id="sbs-back" href="#explore">← Back to the pair</a>
          <h1>Side by side</h1>
          <div class="pills" id="pairs" style="margin:0" role="group" aria-label="Pair"></div>
          <div class="seg" role="group" aria-label="Display"><button id="mode-3d" aria-pressed="true">3D terrain</button><button id="mode-slide" aria-pressed="false">Slide</button></div>
        </div>
        <div class="ctl">
          <label>View <input type="range" id="ctl-view" min="0" max="359" value="35"><output id="out-view"></output></label>
          <label>Sun from <input type="range" id="ctl-az" min="0" max="359" value="300"><output id="out-az"></output></label>
          <label>Sun height <input type="range" id="ctl-el" min="1" max="60" step="0.5" value="14"><output id="out-el"></output></label>
          <label>Vertical exaggeration <input type="range" id="ctl-ve" min="1" max="4" step="0.5" value="2"><output id="out-ve"></output></label>
          <button class="pill" id="sweep">Sweep the sun</button>
          <button class="pill" id="polar-light" title="Puts the Sun 1.5° above the horizon, as at the lunar poles">Light it like the lunar pole</button>
        </div>
        <div class="panels" id="panels"></div>
        <div class="slider" id="slider" hidden>
          <div style="flex:1;min-height:0;display:flex;justify-content:center">
            <div class="stage" id="stage" style="height:100%;aspect-ratio:1;max-width:100%;--p:50%">
              <canvas id="hs-other"></canvas><canvas id="hs-earth" class="top"></canvas><div class="bar"></div>
              <span class="lab" id="lab-earth" style="left:10px"></span><span class="lab" id="lab-other" style="right:10px"></span>
            </div>
          </div>
          <input type="range" id="ctl-slide" min="0" max="100" value="50" aria-label="Compare the two windows">
        </div>
        <p class="printed" id="printed"></p>
      </div>
      <aside class="meas" id="meas" aria-label="Terrain measurements"></aside>
    </section>

    <!-- 4. ALL PAIRS, 5. ONE PAIR, 6. METHOD AND SOURCES: filled by js/pages.js from data/sites.json -->
    <section class="view doc" id="view-explore" hidden></section>
    <section class="view doc" id="view-pair" hidden></section>
    <section class="view doc" id="view-method" hidden></section>
  </main>
  <footer class="credit">
    <div class="viewmode"><span>Size</span>
      <div class="seg" id="sizemode" role="group" aria-label="How big the globes are drawn">
        <button data-size="true" aria-pressed="true" title="The Moon and Mars drawn at their real size next to Earth">True</button>
        <button data-size="equal" aria-pressed="false" title="All three drawn the same size, easier to read">Equal</button>
      </div>
    </div>
    <div class="viewmode"><span>Globes</span>
      <div class="seg" id="viewmode" role="group" aria-label="How the globes are drawn">
        <button data-view="ascii" aria-pressed="true" title="Characters drawn from the NASA imagery">ASCII</button>
        <button data-view="image" aria-pressed="false" title="The NASA imagery itself">Image</button>
      </div>
    </div>
  </footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
